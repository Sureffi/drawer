name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin
      - run: scripts/check.sh
  # macOS is a platform this plugin ships to and nobody in the fleet runs, so
  # this is the only Mac it will ever be on. The build-tagged files — the
  # parent's tty read off ps, the environment that cannot be read at all —
  # already compile under the cross-vet; here they run. librsvg is what
  # unskips the two laws that need a rasteriser and the png stage; without it
  # check.sh says so and carries on, so a brew that fails is not this job
  # failing and the step says as much.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install librsvg
        continue-on-error: true
      - run: scripts/check.sh
