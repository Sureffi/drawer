name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check.sh
  # macOS is a platform this plugin ships to and nobody in the fleet runs, so
  # this is the only Mac it will ever be on. The build-tagged files — the
  # parent's tty read off ps, the environment that cannot be read at all —
  # already compile under the cross-vet; here they run. Nothing is installed
  # first on either runner: the binary carries its layout and its type and
  # paints its own pictures, so a checkout and a Go toolchain are the whole
  # of what check.sh needs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check.sh
